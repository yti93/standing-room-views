---
layout: default
---

<article>
  <div class="post-header">
    {% for cat in page.categories %}<span class="category-pill">{{ cat }}</span>{% endfor %}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
  </div>
</article>
